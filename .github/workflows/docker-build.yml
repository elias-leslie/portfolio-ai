name: Build & Push Docker Images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override'
        required: false

permissions:
  contents: read

# Never cancel an in-flight release build; queue a second run for the same ref.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  image-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build backend smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backend.Dockerfile
          load: true
          tags: portfolio-api:smoke
          cache-from: type=gha,scope=backend-smoke
          cache-to: type=gha,mode=max,scope=backend-smoke
      - name: Build frontend smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          load: true
          tags: portfolio-web:smoke
          build-args: API_URL=http://portfolio-api:8000
          cache-from: type=gha,scope=frontend-smoke
          cache-to: type=gha,mode=max,scope=frontend-smoke
      - name: Exercise fresh images
        run: scripts/docker-image-smoke.sh portfolio-api:smoke portfolio-web:smoke
      - name: Scan backend image for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: portfolio-api:smoke
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '1'
      - name: Scan frontend image for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: portfolio-web:smoke
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '1'

  build:
    needs: image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: docker/backend.Dockerfile
            image-suffix: api
          - component: frontend
            dockerfile: docker/frontend.Dockerfile
            image-suffix: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/elias-leslie/portfolio-${{ matrix.image-suffix }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG//\//-}"
          {
            echo 'list<<EOF'
            echo "$IMAGE:$tag"
            # Only main and release tags may move :latest; manual runs from
            # other refs publish their explicit tag only.
            if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/* ]]; then
              echo "$IMAGE:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
